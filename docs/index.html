<!DOCTYPE html>
<html lang="en">
<head>
<!-- skill:chrome -->
<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patch Factory</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f3ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:      oklch(96.5% 0.009 86);
  --paper-2:    oklch(93.2% 0.012 84);
  --paper-3:    oklch(89.5% 0.014 82);
  --ink:        oklch(23% 0.016 65);
  --ink-2:      oklch(45% 0.014 68);
  --ink-3:      oklch(60% 0.012 70);
  --rule:       oklch(87% 0.014 80);
  --plum:       oklch(46% 0.155 352);
  --plum-hi:    oklch(40% 0.165 352);
  --plum-soft:  oklch(93% 0.035 352);
  --sage:       oklch(46% 0.075 158);
  --sage-soft:  oklch(93% 0.032 158);
  --amber:      oklch(52% 0.115 72);
  --amber-soft: oklch(94% 0.05 78);
  --on-plum:    oklch(97% 0.012 352);
  --r-sm: 8px;
  --r-md: 16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.shell{max-width:640px;margin:0 auto;padding:28px 20px 72px}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:2px solid var(--ink)}
.mast h1{
  font-family:Fraunces,Georgia,serif;font-weight:600;font-optical-sizing:auto;
  font-size:32px;line-height:1;margin:0;letter-spacing:-.02em;
}
.mast .tag{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--plum);font-weight:600;margin-bottom:9px;
}
.gear{
  flex:none;width:40px;height:40px;border-radius:999px;border:1px solid var(--rule);
  background:transparent;color:var(--ink-2);cursor:pointer;font-size:17px;line-height:1;
  display:grid;place-items:center;
  transition:background .3s cubic-bezier(.22,1,.36,1),color .3s cubic-bezier(.22,1,.36,1),border-color .3s cubic-bezier(.22,1,.36,1);
}
.gear:hover,.gear:focus-visible{background:var(--paper-2);color:var(--ink);border-color:var(--paper-3)}
.gear.live{border-color:var(--plum);color:var(--plum)}

/* ---------- status strip ---------- */
.strip{
  display:flex;align-items:center;gap:9px;margin-top:14px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-3);
}
.dot{width:7px;height:7px;border-radius:999px;background:var(--ink-3);flex:none}
.dot.ok{background:var(--sage)}
.dot.bad{background:var(--plum)}
.dot.work{background:var(--amber);animation:pulse 1.5s cubic-bezier(.22,1,.36,1) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
.strip button{
  margin-left:auto;background:none;border:none;padding:6px 2px;color:var(--ink-3);
  font-family:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}
.strip button:hover{color:var(--ink)}

/* ---------- token drawer ---------- */
.drawer{
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .42s cubic-bezier(.22,1,.36,1),opacity .3s cubic-bezier(.22,1,.36,1),margin .42s cubic-bezier(.22,1,.36,1);
}
.drawer.open{max-height:420px;opacity:1;margin-top:18px}
.drawer-in{background:var(--paper-2);border-radius:var(--r-md);padding:20px}
.drawer h2{font-family:Fraunces,serif;font-weight:600;font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
.drawer p{margin:0 0 14px;font-size:14px;color:var(--ink-2);line-height:1.5}
.drawer p a{color:var(--plum);text-underline-offset:2px}
.drawer label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:7px}
.drawer input{
  width:100%;padding:13px 14px;border:1px solid var(--paper-3);border-radius:var(--r-sm);
  background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px;
  transition:border-color .25s cubic-bezier(.22,1,.36,1);
}
.drawer input:focus{outline:none;border-color:var(--plum)}
.drawer .acts{display:flex;gap:10px;margin-top:14px}

/* ---------- buttons ---------- */
.btn{
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;
  padding:12px 18px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .25s cubic-bezier(.22,1,.36,1),color .25s cubic-bezier(.22,1,.36,1),border-color .25s cubic-bezier(.22,1,.36,1),opacity .25s cubic-bezier(.22,1,.36,1);
  text-decoration:none;
}
.btn-solid{background:var(--plum);color:var(--on-plum)}
.btn-solid:hover,.btn-solid:focus-visible{background:var(--plum-hi)}
.btn-quiet{background:transparent;color:var(--ink-2);border-color:var(--paper-3)}
.btn-quiet:hover,.btn-quiet:focus-visible{background:var(--paper-2);color:var(--ink)}
.btn[disabled],.btn.busy{opacity:.5;pointer-events:none}

/* ---------- app list ---------- */
.list{margin-top:30px}
.app{padding:24px 0;border-bottom:1px solid var(--rule)}
.app:first-child{padding-top:8px}
.app-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.app h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:25px;line-height:1.1;margin:0;letter-spacing:-.015em}
.badge{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;padding:3px 8px;border-radius:999px;
}
.badge.fresh{background:var(--sage-soft);color:var(--sage)}
.badge.off{background:var(--paper-2);color:var(--ink-3)}
.badge.run{background:var(--amber-soft);color:var(--amber)}
.meta{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);
  margin:9px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;
}
.meta b{color:var(--ink-2);font-weight:500}
.row{display:flex;gap:10px;margin-top:16px;align-items:stretch}
.row .btn-solid{flex:1}
.hint{margin:14px 0 0;font-size:14px;color:var(--ink-2);line-height:1.5}

/* older builds */
.older{margin-top:14px}
.older summary{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-3);cursor:pointer;
  list-style:none;padding:8px 0;min-height:34px;display:flex;align-items:center;gap:7px;
}
.older summary::-webkit-details-marker{display:none}
.older summary::before{content:'+';font-weight:600;color:var(--plum);font-size:13px}
.older[open] summary::before{content:'–'}
.older summary:hover{color:var(--ink)}
.older a{
  display:flex;justify-content:space-between;gap:14px;padding:11px 0;
  border-top:1px dashed var(--rule);font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  color:var(--ink-2);text-decoration:none;min-height:44px;align-items:center;
}
.older a:hover{color:var(--plum)}
.older a span:last-child{color:var(--ink-3);flex:none}

/* ---------- skeleton / empty / error ---------- */
.skel{padding:24px 0;border-bottom:1px solid var(--rule)}
.bar{height:12px;border-radius:6px;background:var(--paper-2);animation:sheen 1.4s cubic-bezier(.22,1,.36,1) infinite}
.bar.t{height:22px;width:44%;margin-bottom:14px}
.bar.m{width:66%;margin-bottom:18px}
.bar.b{height:44px;border-radius:var(--r-sm);width:100%}
@keyframes sheen{0%,100%{opacity:1}50%{opacity:.45}}

.notice{margin-top:30px;padding:22px;border-radius:var(--r-md);background:var(--plum-soft)}
.notice h3{font-family:Fraunces,serif;font-weight:600;font-size:19px;margin:0 0 6px;color:var(--plum-hi)}
.notice p{margin:0 0 12px;font-size:14.5px;color:oklch(34% 0.1 352);line-height:1.5}
.notice p:last-child{margin-bottom:0}

footer{margin-top:40px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 16px}
footer a{color:var(--ink-3)}
footer a:hover{color:var(--plum)}

@media (min-width:600px){
  .shell{padding:44px 24px 90px}
  .mast h1{font-size:40px}
  .app h3{font-size:28px}
  .row .btn-solid{flex:0 0 auto;min-width:210px}
}
@media (pointer:coarse){
  .btn{min-height:48px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="shell">

  <div class="mast">
    <div>
      <span class="tag">Patch Factory</span>
      <h1>Fresh builds,<br>signed and ready</h1>
    </div>
    <button class="gear" id="gear" aria-label="Build settings" title="Build settings">⚙</button>
  </div>

  <div class="strip">
    <span class="dot" id="dot"></span>
    <span id="statusText">Checking releases…</span>
    <button id="refresh" type="button">Refresh</button>
  </div>

  <div class="drawer" id="drawer">
    <div class="drawer-in">
      <h2>Trigger builds from here</h2>
      <p>Paste a fine-grained token with <strong>Actions: read and write</strong> on this repo. It is kept in this browser only, never sent anywhere but GitHub. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Make one</a></p>
      <label for="tok">Personal access token</label>
      <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
      <div class="acts">
        <button class="btn btn-solid" id="saveTok" type="button">Save</button>
        <button class="btn btn-quiet" id="clearTok" type="button">Forget</button>
      </div>
    </div>
  </div>

  <div class="list" id="list">
    <div class="skel"><div class="bar t"></div><div class="bar m"></div><div class="bar b"></div></div>
    <div class="skel"><div class="bar t"></div><div class="bar m"></div><div class="bar b"></div></div>
  </div>

  <footer>
    <span>arm64-v8a · Android 10+</span>
    <a href="https://github.com/govinda-rajulu/patch-factory/releases" target="_blank" rel="noopener">All releases</a>
    <a href="https://github.com/govinda-rajulu/patch-factory/actions" target="_blank" rel="noopener">Build log</a>
  </footer>

</div>

<script>
const OWNER = 'govinda-rajulu';
const REPO  = 'patch-factory';
const WF    = 'manual-patch.yml';

// tag prefix -> what a human calls it. Order here is display order.
const CATALOG = [
  { prefix:'youtube-morphe', target:'youtube',    name:'YouTube',       note:'No ads, background play, SponsorBlock' },
  { prefix:'gg-photos',      target:'photos',     name:'Google Photos', note:'Unlimited original-quality backup' },
  { prefix:'truecaller',     target:'truecaller', name:'Truecaller',    note:'Ads and trackers stripped' },
  { prefix:'adguard',        target:'adguard',    name:'AdGuard',       note:'Not enabled yet' }
];

const $ = id => document.getElementById(id);
let TOKEN = localStorage.getItem('pf_token') || '';
let pollTimer = null;

/* ---------- helpers ---------- */
const mb = n => (n / 1048576).toFixed(0) + ' MB';
function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600)  return Math.max(1, Math.round(s/60)) + ' min ago';
  if (s < 86400) return Math.round(s/3600) + ' hr ago';
  const d = Math.round(s/86400);
  return d === 1 ? 'yesterday' : d + ' days ago';
}
function setStatus(text, kind){
  $('statusText').textContent = text;
  $('dot').className = 'dot' + (kind ? ' ' + kind : '');
}
function headers(auth){
  const h = { 'Accept':'application/vnd.github+json' };
  if (auth && TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  return h;
}

/* ---------- token drawer ---------- */
$('gear').onclick = () => {
  $('drawer').classList.toggle('open');
  if ($('drawer').classList.contains('open')) $('tok').focus();
};
$('saveTok').onclick = () => {
  const v = $('tok').value.trim();
  if (!v) return;
  TOKEN = v;
  localStorage.setItem('pf_token', v);
  $('tok').value = '';
  $('drawer').classList.remove('open');
  $('gear').classList.add('live');
  load();
};
$('clearTok').onclick = () => {
  TOKEN = '';
  localStorage.removeItem('pf_token');
  $('tok').value = '';
  $('gear').classList.remove('live');
  load();
};
if (TOKEN) $('gear').classList.add('live');
$('refresh').onclick = () => load();

/* ---------- data ---------- */
async function load(){
  setStatus('Checking releases…', 'work');
  let releases;
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/releases?per_page=100&cb=${Date.now()}`, { headers: headers(true) });
    if (r.status === 403) throw new Error('rate');
    if (!r.ok) throw new Error('http ' + r.status);
    releases = await r.json();
  } catch (e) {
    render(null, e.message === 'rate' ? 'rate' : 'net');
    return;
  }

  const byPrefix = {};
  for (const rel of releases){
    const apk = (rel.assets || []).find(a => a.name.endsWith('.apk'));
    if (!apk) continue;
    const i = rel.tag_name.lastIndexOf('-v');
    if (i < 0) continue;
    const p = rel.tag_name.slice(0, i);
    (byPrefix[p] = byPrefix[p] || []).push({
      version: rel.tag_name.slice(i + 2),
      url: apk.browser_download_url,
      size: apk.size,
      when: apk.updated_at || rel.published_at
    });
  }
  for (const p in byPrefix) byPrefix[p].sort((a,b) => new Date(b.when) - new Date(a.when));

  render(byPrefix, null);
  setStatus('Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), 'ok');
  if (TOKEN) checkRuns();
}

/* ---------- render ---------- */
function render(data, err){
  const list = $('list');

  if (err){
    setStatus(err === 'rate' ? 'GitHub rate limit hit' : 'Could not reach GitHub', 'bad');
    list.innerHTML = `
      <div class="notice">
        <h3>${err === 'rate' ? 'Rate limited' : 'No connection'}</h3>
        <p>${err === 'rate'
          ? 'GitHub allows 60 anonymous checks an hour from one address. Saving a token in settings raises that to 5,000, or just wait a few minutes.'
          : 'Check the network and try again. The releases page still works directly on GitHub.'}</p>
        <p><a class="btn btn-solid" href="https://github.com/${OWNER}/${REPO}/releases" target="_blank" rel="noopener">Open releases on GitHub</a></p>
      </div>`;
    return;
  }

  list.innerHTML = CATALOG.map(app => {
    const builds = data[app.prefix] || [];

    if (!builds.length){
      return `
        <div class="app" data-target="${app.target}">
          <div class="app-top"><h3>${app.name}</h3><span class="badge off">No build yet</span></div>
          <p class="hint">${app.note}.</p>
          <div class="row">${TOKEN
            ? `<button class="btn btn-quiet act" data-target="${app.target}">Build it now</button>`
            : `<span class="meta">Add a token in settings to build this.</span>`}</div>
        </div>`;
    }

    const top = builds[0];
    const rest = builds.slice(1);
    const isFresh = (Date.now() - new Date(top.when)) < 864e5 * 3;

    return `
      <div class="app" data-target="${app.target}">
        <div class="app-top">
          <h3>${app.name}</h3>
          ${isFresh ? '<span class="badge fresh">New</span>' : ''}
        </div>
        <p class="meta">
          <span><b>${top.version}</b></span>
          <span>${mb(top.size)}</span>
          <span>built ${ago(top.when)}</span>
        </p>
        <div class="row">
          <a class="btn btn-solid" href="${top.url}">Download APK</a>
          ${TOKEN ? `<button class="btn btn-quiet act" data-target="${app.target}">Rebuild</button>` : ''}
        </div>
        ${rest.length ? `
        <details class="older">
          <summary>${rest.length} older build${rest.length > 1 ? 's' : ''}</summary>
          ${rest.map(b => `<a href="${b.url}"><span>${b.version}</span><span>${mb(b.size)} · ${ago(b.when)}</span></a>`).join('')}
        </details>` : ''}
      </div>`;
  }).join('');

  list.querySelectorAll('.act').forEach(b => b.onclick = () => dispatch(b.dataset.target, b));
}

/* ---------- trigger a build ---------- */
async function dispatch(target, btn){
  if (!TOKEN) return;
  btn.classList.add('busy');
  btn.textContent = 'Starting…';
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WF}/dispatches`, {
      method:'POST',
      headers: Object.assign(headers(true), { 'Content-Type':'application/json' }),
      body: JSON.stringify({ ref:'main', inputs:{ target } })
    });
    if (r.status === 204){
      setStatus('Build queued for ' + target + '…', 'work');
      btn.textContent = 'Queued';
      setTimeout(checkRuns, 6000);
    } else {
      const t = await r.text();
      setStatus('Could not start: ' + (r.status === 401 || r.status === 403 ? 'token rejected' : r.status), 'bad');
      console.warn(t);
      btn.classList.remove('busy');
      btn.textContent = 'Retry';
    }
  } catch {
    setStatus('Could not reach GitHub', 'bad');
    btn.classList.remove('busy');
    btn.textContent = 'Retry';
  }
}

/* ---------- live run status ---------- */
async function checkRuns(){
  clearTimeout(pollTimer);
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?per_page=3&cb=${Date.now()}`, { headers: headers(true) });
    if (!r.ok) return;
    const { workflow_runs = [] } = await r.json();
    const live = workflow_runs.find(x => x.status === 'in_progress' || x.status === 'queued');

    document.querySelectorAll('.badge.run').forEach(n => n.remove());

    if (live){
      setStatus('Building… about 2 minutes', 'work');
      const card = document.querySelector('.app');
      if (card){
        const b = document.createElement('span');
        b.className = 'badge run';
        b.textContent = live.status === 'queued' ? 'Queued' : 'Building';
        (document.querySelector('.app-top') || card).appendChild(b);
      }
      pollTimer = setTimeout(checkRuns, 15000);
    } else if (workflow_runs.length && workflow_runs[0].conclusion === 'failure'){
      setStatus('Last build failed, check the log', 'bad');
    }
  } catch { /* silent, this is a nicety */ }
}

load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
