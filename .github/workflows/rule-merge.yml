name: 11. Rule merge
# W15d (owner, 21 Oct 2026): a Selection watch rule pull request merges itself only when its
# checks, its Onboarding review and every app's nonpublishing test build are green; anything
# red or touching an account app's paid name waits for the owner. Runs the default branch's
# own code, never the pull request's. See src/etc/rule_merge.py.
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
on:
  workflow_run:
    workflows: ["1. Manual Patch", "3. Validate", "Onboarding review"]
    types: [completed]
  schedule:
    # W16: two a day. Runs the bot starts wake nothing (L069), so this remains the safety net.
    - cron: "7 4 * * *"  # 09:37 IST, in case a trigger was missed
    - cron: "7 16 * * *"  # 21:37 IST, in case a trigger was missed
  workflow_dispatch:
jobs:
  # W16i (owner, 25 Oct 2026): every Manual Patch, Validate and Onboarding review completion
  # started a merge pass that could wait 20 minutes. rule_merge.py reads every open rule pull
  # request, so one pass after the last trigger is enough. A newer trigger cancels this wait;
  # schedule and manual runs skip it and merge at once. The merge job keeps its own queue.
  settle:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: rule-merge-settle
      cancel-in-progress: true
    steps:
      - name: Let related runs settle
        run: sleep 180
  merge:
    needs: settle
    if: always() && (needs.settle.result == 'success' || needs.settle.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      # Its own queue: sharing main-writer would let a burst of these runs cancel a pending
      # Selection or Community watch (GitHub keeps one pending run per group). A writer that
      # meets a moved main stops with MAIN_MOVED and retries; rule_merge waits while a packet/* branch exists.
      # W16i: on the job, not the workflow, so a newer run's settle can cancel an older one's.
      group: rule-merge
      cancel-in-progress: false
    steps:
      - name: Checkout main (the rule that runs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Merge green rule pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          # W15e: wait up to 20 min for running test builds instead of missing them.
          PF_RULE_MERGE_PATIENCE: "1200"
        run: python3 src/etc/rule_merge.py
