name: 10. Selection watch
# Packet W13 (10 Oct 2026, owner design): every app's patch choice stays current by itself.
# A chosen name the provider no longer offers leaves the include list (builds already go
# without it), provider name baselines are re-seeded, new patches wait for the owner, and a
# digest of every provider's releases (Morphe included) lands on one standing issue.
# Nothing is ever added here. See src/etc/selection_watch.py.
permissions:
  contents: write
  issues: write
on:
  schedule:
    - cron: "11 2 * * *"  # 07:41 IST daily
  workflow_dispatch:
concurrency:
  # Shared with keepalive and community watch: all push to main, so they queue instead of racing.
  group: main-writer
  cancel-in-progress: false
jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Read the last digest state (watch-state branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/state.json?ref=watch-state" > "$RUNNER_TEMP/state.json"; then
            echo "state read: $(wc -c < "$RUNNER_TEMP/state.json") bytes"
          else
            rm -f "$RUNNER_TEMP/state.json"; echo "no state yet: first run"
          fi
      - name: Read every provider and plan
        env:
          GH_TOKEN: ${{ github.token }}
          PF_WATCH_STATE_FILE: ${{ runner.temp }}/state.json
        run: python3 src/etc/selection_watch.py collect
      - name: Keep the report and plan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selection-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: selection-watch-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Commit removals and baselines to main
        run: python3 src/etc/selection_watch.py apply
      - name: Save the digest state (watch-state branch, never main)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir "$RUNNER_TEMP/pub"
          cp selection-watch-evidence/state.json "$RUNNER_TEMP/pub/state.json"
          cd "$RUNNER_TEMP/pub"
          git init -q -b watch-state
          git add state.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "selection watch state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" watch-state:watch-state
      - name: Update the standing issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/etc/selection_watch.py issue
