name: 8. Community watch
permissions:
  contents: write
  issues: write
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
concurrency:
  group: community-watch-main
  cancel-in-progress: false
jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Collect complete index comparison and website history
        id: collect
        run: python3 src/etc/community_watch.py collect
      - name: Preserve inputs and full report before delivery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: community-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/community-watch-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
      - name: Deliver complete report and verify every part
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/etc/community_watch.py report
      - name: Advance snapshot only after verified report acknowledgement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/etc/community_watch.py advance
      - name: Preserve delivery receipt and final phase status
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: community-watch-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/community-watch-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
