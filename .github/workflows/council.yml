name: Council
# Advisory only. Free model seats review pull requests, vote on one patch or provider
# question, answer one factual question from cited repository facts, audit one shard of
# the repository, or triage every open issue (close, keep or owner, with cited evidence). The job can read the repository and write one comment; it never pushes,
# merges, dispatches, publishes or changes settings. See docs/council/README.md.
permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Desk rotation (desk_job in council.py): one audit shard twice a day, triage on Monday;
    # Sunday afternoon audit also files up to eight deduped, verified review findings.
    # All jobs write on the desk issue in seats.json. One job at a time keeps free tiers answering.
    - cron: "17 3 * * *"  # 08:47 IST daily: one audit shard (Monday: triage)
    - cron: "17 15 * * *"  # 20:47 IST daily: one audit shard
    # W15e (owner, 22 Oct 2026): solo shifts, one seat at a time in persona order (PERSONAS.md).
    - cron: "17 21 * * *"  # 02:47 IST daily: one seat's solo shift
    - cron: "17 0 * * *"  # 05:47 IST daily: one seat's solo shift
    - cron: "17 9 * * *"  # 14:47 IST daily: one seat's solo shift
    - cron: "17 12 * * *"  # 17:47 IST daily: one seat's solo shift
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = check which seats answer; question = vote on one patch or provider; ask = factual answer with cited facts; audit = review one shard of the repository; triage = judge every open issue; shift = one seat works its solo shift (input seat)'
        type: choice
        options: [probe, question, ask, audit, triage, shift]
        default: probe
      issue:
        description: 'Question, ask, audit, triage or shift mode: issue number for the comment'
        required: false
        default: ''
      seat:
        description: 'Shift mode: seat id from src/council/seats.json (gpt, gemini, nemotron, open, codestral, command, groq)'
        required: false
        default: ''
      target:
        description: 'Question mode (required) or ask mode (optional): target id from src/targets.json'
        required: false
        default: ''
      kind:
        description: 'Question mode: what is being judged'
        type: choice
        options: [patch, provider]
        default: patch
      name:
        description: 'Question mode: exact patch name or provider name'
        required: false
        default: ''
      note:
        description: 'Question mode: optional context for the seats'
        required: false
        default: ''
      question:
        description: 'Ask mode: one factual question, 500 characters or fewer'
        required: false
        default: ''
      shard:
        description: 'Audit mode: shard id from src/council/shards.json'
        required: false
        default: ''
concurrency:
  # One review per PR; all scheduled/desk jobs share one group so L039 is true even if a
  # manual dispatch overlaps a schedule. A newer run replaces an older unfinished run.
  group: council-${{ github.event.pull_request.number || 'desk' }}
  cancel-in-progress: true
jobs:
  council:
    name: Advisory council (desk comments and weekly review issues)
    # Fork PRs and bot PRs never receive the model keys.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    # Audit mode stops starting new parts after 30 minutes, leaving 20 for the last part (PF_AUDIT_SECONDS in council.py).
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout the reviewed base, never the pull request's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Convene the council
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          PF_REPO: ${{ github.repository }}
          PF_EVENT: ${{ github.event_name }}
          PF_PR: ${{ github.event.pull_request.number }}
          PF_MODE: ${{ inputs.mode }}
          PF_ISSUE: ${{ inputs.issue }}
          PF_TARGET: ${{ inputs.target }}
          PF_KIND: ${{ inputs.kind }}
          PF_NAME: ${{ inputs.name }}
          PF_NOTE: ${{ inputs.note }}
          PF_QUESTION: ${{ inputs.question }}
          PF_SHARD: ${{ inputs.shard }}
          PF_SEAT: ${{ inputs.seat }}
          PF_COUNCIL_STAGED: ${{ vars.PF_COUNCIL_STAGED }}
          PF_FIXES: council-out/fixes.patch
        run: |
          # The PR that adds the council runs this against a base without it: nothing to do.
          if [ ! -f src/council/council.py ]; then echo "council code is not on the base commit yet"; exit 0; fi
          python3 src/council/council.py
      # W14 fix lane: proposed one-line fixes from an audit, checked on a scratch copy with no
      # model keys and no token, then kept as a run artifact. Nothing is committed or pushed.
      - name: Check proposed fixes (no keys, nothing pushed)
        if: always() && hashFiles('council-out/fixes.patch') != ''
        run: bash src/council/check_fixes.sh council-out/fixes.patch
      - name: Keep proposed fixes
        if: always() && hashFiles('council-out/fixes.patch') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: council-fixes
          path: council-out/
          retention-days: 14
          if-no-files-found: ignore
