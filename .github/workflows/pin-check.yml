name: Weekly pin store check
# Manual, report-only evidence for exact build pins. The wrapper follows the build's
# lazy FlareSolverr/CloudflareBypass path only through the release variant row.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  pin-health:
    name: Check pinned store listings
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read store listings (no APK transfer)
        id: check
        env:
          PF_STORE_LAZY: '1'
        run: |
          set +e
          python3 src/etc/pin_check.py --json-out pin-check.json --evidence-dir pin-check-evidence
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # Report-only: preserve output and evidence even when the probe itself errors.
          exit 0
      - name: Preserve pin-check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pin-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pin-check.json
            pin-check-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Stop store helpers
        if: ${{ always() }}
        run: bash src/build/store_services.sh cleanup || true
