name: Status page data
# Packet W2 (8 Oct 2026): the owner could not tell from Pages what recent runs did. After each
# run of the automations below, src/etc/status.py reads GitHub's own records
# (GET only) and writes status.json in plain words; the Builds and Watch tabs of Pages show it. The daily cron
# only refreshes "updated N ago" on quiet days: every listed run already triggers it. The only write
# is one file force-pushed to the `status` branch (one commit, no history growth, never main).
# Pull-request runs are ignored by the script. No checkout of anything but main.
# The immediate list is limited to builds and watcher reports that the Pages owner reads.
# The daily cron still refreshes every workflow's latest record, including checks and helpers.
permissions:
  contents: read
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] main repository metadata only and trusted checkout
    workflows: ["1. Manual Patch", "2. Check new patch", "4. Explore patches", "5. Add target", "6. Provider watch", "7. Nightly watch", "8. Community watch", "MCP scout", "9. Batch Patch", "Tooling watch", "10. Selection watch", "Needs you", "Keepalive", "11. Rule merge", "Retention preview"]
    types: [completed]
    # W16k (owner, 25 Oct 2026: runs were bloating): only runs on main wake this; a packet
    # smoke used to start Notify, Status and Qualify for nothing (130 of 299 runs that day).
    branches: [main]
  schedule:
    - cron: "53 2 * * *"  # 08:23 IST daily
  workflow_dispatch:
jobs:
  status:
    name: Write status.json
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && contains(fromJSON('["success","failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
      issues: read
    steps:
      # W16i (owner, 25 Oct 2026): a PR batch finished a dozen runs and each one started this.
      # Wait first; after the wait, a run that sees a newer Status run stops quietly, so a burst
      # writes the page once, after the last run. Schedule and manual runs do not wait.
      - name: Let related runs settle
        if: github.event_name == 'workflow_run'
        run: sleep 180
      # W16k: no cancel-in-progress any more (Notify runs in this workflow and must never be
      # cancelled). After the wait, a run that sees a newer Status run stops quietly; the newest publishes.
      - name: Newest run publishes
        id: newest
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWN: ${{ github.run_id }}
        run: |
          newer=$(gh api "repos/$REPO/actions/workflows/status.yml/runs?event=workflow_run&per_page=20" --jq "[.workflow_runs[] | select(.id > $OWN)] | length" 2>/dev/null) || newer=0
          case "$newer" in ''|*[!0-9]*) newer=0;; esac
          echo "newer=$newer" >> "$GITHUB_OUTPUT"
          if [ "$newer" != "0" ]; then echo "A newer Status page data run publishes; this one stops here." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Checkout main (the reader that runs)
        if: steps.newest.outputs.newer == '0' || github.event_name != 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Read recent runs, releases and failing issues
        if: steps.newest.outputs.newer == '0' || github.event_name != 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PF_REPO: ${{ github.repository }}
        run: python3 src/etc/status.py --out status.json
      - name: Publish status.json to the status branch
        if: steps.newest.outputs.newer == '0' || github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir pub
          cp status.json pub/status.json
          # Only status.json: a .md or src/ file here would start Validate on the status branch.
          cd pub
          git init -q -b status
          git add status.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" status:status
          echo "published status.json ($(wc -c < status.json) bytes)" >> "$GITHUB_STEP_SUMMARY"

  # W16k: Notify on failure runs here as a called workflow, one job per finished run.
  # Its own concurrency group never merges or cancels runs.
  notify:
    name: Failure issue
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      issues: write
      actions: read
    uses: ./.github/workflows/notify-failure.yml
  cache-prune:
    name: Prune stale Actions caches
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout cache-pruning code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete stale caches and write the summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 src/etc/cache_prune.py --repo "$REPO" --apply
