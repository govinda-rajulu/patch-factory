name: 3. Validate
permissions:
  contents: read
on:
  pull_request:
  push:
    paths:
      - 'src/**'
      - '.github/**'
      - 'tests/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
jobs:
  validate:
    name: Validate targets and scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Shared preflight
        run: python3 src/etc/preflight.py
      - name: Local regression contracts
        run: python3 -m unittest discover -s tests -p 'test_repair.py' -v
      - name: Finished APK identity contracts
        run: python3 -m unittest discover -s tests -p 'test_identity.py' -v
      - name: Exact bundle transport contracts
        run: python3 -m unittest discover -s tests -p 'test_transport.py' -v
      - name: Workflow and watcher contracts
        run: python3 -m unittest discover -s tests -p '*_contracts.py' -v
      - name: Page and notifier contracts
        run: |
          node tests/portal_contracts.cjs
          node tests/notify_contracts.cjs
      - name: targets.json integrity
        run: |
          jq -e . src/targets.json > /dev/null || { echo "::error::targets.json is not valid JSON"; exit 1; }
          FAIL=0
          while IFS=$'\t' read -r id pd op; do
            for side in include exclude; do
              [ -f "src/patches/$pd/$side-patches" ] || { echo "::error::$id: missing src/patches/$pd/$side-patches"; FAIL=1; }
            done
            F="src/options/$op.json"
            if [ ! -f "$F" ]; then
              echo "::error::$id: missing $F"; FAIL=1
            elif [ "$(jq -r 'type' "$F")" != "array" ]; then
              echo "::error::$F must be a JSON array. morphe-desktop rejects an object."; FAIL=1
            fi
          done < <(jq -r '.[] | . as $t | .candidates[] | [$t.id, .patch_dir, .options] | @tsv' src/targets.json)
          while IFS=$'\t' read -r id tp; do
            [ -n "$tp" ] && [ "$tp" != "null" ] || { echo "::error::$id: enabled target has no tag_prefix"; FAIL=1; }
          done < <(jq -r '.[] | select(.enabled) | [.id, (.tag_prefix // "")] | @tsv' src/targets.json)
          [ "$FAIL" = 0 ] && echo "targets.json OK"
          exit $FAIL
      - name: Shell syntax
        run: |
          for f in src/build/*.sh src/etc/*.sh; do
            bash -n "$f" || { echo "::error::$f failed bash -n"; exit 1; }
          done
          echo "all scripts parse"
      - name: New-field integrity
        run: |
          FAIL=0
          while IFS=$'\t' read -r id host; do
            if [ "$host" != "github" ]; then
              echo "::error::$id: primary candidates must be host=github; GitLab is supported only as an extra bundle"; FAIL=1
            fi
          done < <(jq -r '.[] | .id as $i | .candidates[] | [$i, (.host // "github")] | @tsv' src/targets.json)
          while IFS=$'\t' read -r id nm host pid owner repo; do
            [ -n "$nm" ] && [ "$nm" != "null" ] || { echo "::error::$id: extra_bundles entry has no name"; FAIL=1; }
            case "$host" in
              gitlab) [ "$pid" != "-" ] && [ "$pid" != "null" ] || { echo "::error::$id: gitlab extra needs project_id"; FAIL=1; } ;;
              github) [ "$owner" != "-" ] && [ "$repo" != "-" ] || { echo "::error::$id: github extra needs owner and repo"; FAIL=1; } ;;
              *) echo "::error::$id: unknown extra host '$host'"; FAIL=1 ;;
            esac
          done < <(jq -r '.[] | .id as $i | (.extra_bundles // [])[] | [$i, .name, (.host // "github"), (.project_id // "-"), (.owner // "-"), (.repo // "-")] | @tsv' src/targets.json)
          EB=$(jq -r '[.[] | (.extra_bundles // []) | length] | add // 0' src/targets.json)
          echo "extra_bundles declared across all targets: $EB"
          if [ "$EB" -gt 0 ]; then
            [ -f src/build/fetch_bundle.sh ] || { echo "::error::extra_bundles declared but src/build/fetch_bundle.sh is missing"; FAIL=1; }
            grep -q extra_bundles src/build/build.sh || { echo "::error::extra_bundles declared but build.sh never reads it"; FAIL=1; }
            grep -q 'EXTRA_P' src/build/build.sh || { echo "::error::extra_bundles declared but build.sh has no per-bundle -p logic"; FAIL=1; }
          fi
          [ "$FAIL" = 0 ] && echo "new-field integrity OK"
          exit $FAIL
      - name: Exclusive integrity
        run: |
          FAIL=0
          EX=$(jq -r '[.[] | select(.exclusive == true)] | length' src/targets.json)
          echo "targets with exclusive: $EX"
          if [ "$EX" -gt 0 ]; then
            grep -q -- --exclusive src/build/build.sh || { echo "::error::exclusive declared but build.sh never passes --exclusive"; FAIL=1; }
            while IFS=: read -r id pd; do
              [ -s "src/patches/$pd/include-patches" ] || { echo "::error::$id: exclusive needs a non-empty include-patches in $pd"; FAIL=1; }
            done < <(jq -r '.[] | select(.exclusive == true) | .id as $i | .candidates[] | $i + ":" + .patch_dir' src/targets.json)
          fi
          [ "$FAIL" = 0 ] && echo "exclusive integrity OK"
          exit $FAIL
      - name: Extra patch dirs
        run: |
          FAIL=0
          ED=$(jq -r '[.[] | (.extra_bundles // [])[] | select(.patch_dir)] | length' src/targets.json)
          echo "extras declaring patch_dir: $ED"
          if [ "$ED" -gt 0 ]; then
            [ -f src/build/selections.sh ] || { echo "::error::extra patch_dir declared but selections.sh is missing"; FAIL=1; }
            grep -q selections.sh src/build/build.sh || { echo "::error::extra patch_dir declared but build.sh never calls selections.sh"; FAIL=1; }
            while IFS=: read -r id nm pd; do
              for side in include exclude; do
                [ -f "src/patches/$pd/$side-patches" ] || { echo "::error::$id/$nm: missing src/patches/$pd/$side-patches"; FAIL=1; }
              done
            done < <(jq -r '.[] | .id as $i | (.extra_bundles // [])[] | select(.patch_dir) | $i + ":" + .name + ":" + .patch_dir' src/targets.json)
          fi
          [ "$FAIL" = 0 ] && echo "extra patch dirs OK"
          exit $FAIL
      - name: Dropdown coverage
        run: |
          FAIL=0
          W=.github/workflows/manual-patch.yml
          while read -r id; do
            grep -q -- "- '$id'" "$W" || { echo "::error::$id is enabled but missing from the target dropdown in $W"; FAIL=1; }
          done < <(jq -r '.[] | select(.enabled) | .id' src/targets.json)
          [ "$FAIL" = 0 ] && echo "dropdown covers every enabled target"
          exit $FAIL
      - name: apps.json coverage
        run: |
          A=src/build/helper/apps.json
          jq -e . "$A" > /dev/null || { echo "::error::apps.json is not valid JSON"; exit 1; }
          FAIL=0; OK=0; TOT=0
          while IFS=: read -r id pkg; do
            TOT=$((TOT+1))
            U=$(jq -r --arg p "$pkg" '(.apkmirror[$p].list_url // .apkpure[$p].download_url) // ""' "$A")
            if [ -n "$U" ]; then OK=$((OK+1)); else
              echo "::error::$id: $pkg has no apkmirror list_url, get_apk cannot download it"; FAIL=1
            fi
          done < <(jq -r '.[] | select(.enabled) | .id + ":" + .package' src/targets.json)
          echo "apps.json covers $OK of $TOT enabled packages"
          while IFS=: read -r id pkg; do
            U=$(jq -r --arg p "$pkg" '(.apkmirror[$p].list_url // .apkpure[$p].download_url) // ""' "$A")
            [ -n "$U" ] || echo "::warning::$id is disabled and $pkg is not in apps.json, enabling it alone will not build"
          done < <(jq -r '.[] | select(.enabled | not) | .id + ":" + .package' src/targets.json)
          exit $FAIL
      - name: Banned patches
        run: bash src/etc/bancheck.sh
      - name: Quarantined patches
        run: bash src/etc/quarantine.sh
      - name: Pages catalog matches targets.json
        run: python3 src/etc/pagegen.py --check
      - name: Target dropdown matches targets.json
        run: python3 src/etc/dropgen.py --check
      - name: CREDITS matches targets.json
        run: python3 src/etc/credits.py --check
      - name: Agent contract exists and names the protected paths
        run: |
          [ -s AGENTS.md ] || { echo "::error::AGENTS.md is missing; an agent would work without a contract"; exit 1; }
          FAIL=0
          for p in "workflows" "BANNED" "CONFIRM" "QUARANTINE" "TOOLING.sha256" "_attic"; do
            grep -q "$p" AGENTS.md || { echo "::error::AGENTS.md does not protect $p"; FAIL=1; }
          done
          grep -qi "never push to .main" AGENTS.md || { echo "::error::AGENTS.md must forbid pushing to main"; FAIL=1; }
          [ "$FAIL" = 0 ] && echo "agent contract covers every protected path"
          exit $FAIL
      - name: Unreferenced patch dirs are reported, not deleted
        run: bash src/etc/orphans.sh
      - name: README state block matches targets.json
        run: python3 src/etc/readmegen.py --check
      - name: Exact source and execution input contracts
        run: python3 -m unittest discover -s tests -p 'test_source_inputs.py' -v
      - name: Obtainium generator runs
        run: python3 src/etc/obtainium.py --check
      - name: No workflow_dispatch input interpolated into a shell command
        run: bash src/etc/nointerp.sh
      - name: shellcheck
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          # SC1091 sourced file not followed, SC2086 word splitting we rely on for flag lists
          shellcheck -S error -e SC1091,SC2086 src/build/*.sh src/etc/*.sh
      # ACTION_COMPATIBILITY_SMOKE_START
      # Small synthetic files only. No APK, signing secrets, dispatch or API writes.
      # These steps are part of the existing mandatory Validate check, not advisory.
      - name: Exercise setup-java v6 with Temurin
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Temurin Java major
        run: java -XshowSettings:properties -version 2>&1 | grep -Eq 'java.specification.version = 21$'
      - name: Exercise setup-java v6 with Zulu
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Verify Zulu Java major and create synthetic fixtures
        run: |
          java -XshowSettings:properties -version 2>&1 | grep -Eq 'java.specification.version = 21$'
          mkdir -p action-smoke-source/nested action-smoke-cache
          printf 'patch-factory action compatibility\n' > action-smoke-source/nested/value.txt
          printf 'not a secret; hidden-file exclusion probe\n' > action-smoke-source/.hidden-probe
          cp action-smoke-source/nested/value.txt action-smoke-cache/value.txt
          cd action-smoke-source
          sha256sum nested/value.txt > SHA256SUMS
      - name: Save isolated synthetic cache using v6
        uses: actions/cache/save@v6
        with:
          path: action-smoke-cache
          key: pf-action-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Change only the local synthetic cache probe
        run: printf 'must be replaced by the cache restore\n' > action-smoke-cache/value.txt
      - name: Restore and exercise cache v6
        id: smoke_cache
        uses: actions/cache@v6
        with:
          path: action-smoke-cache
          key: pf-action-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Verify exact cache hit and restored bytes
        env:
          CACHE_HIT: ${{ steps.smoke_cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          cmp action-smoke-source/nested/value.txt action-smoke-cache/value.txt
      - name: Upload synthetic artifact with v7
        uses: actions/upload-artifact@v7
        with:
          name: pf-action-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: action-smoke-source/
          archive: true
          if-no-files-found: error
          retention-days: 1
      - name: Download exact same-run synthetic artifact with v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pf-action-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: action-smoke-download/
          digest-mismatch: error
          skip-decompress: false
      - name: Verify extraction layout, content and hidden-file exclusion
        run: |
          (cd action-smoke-download && sha256sum -c SHA256SUMS)
          cmp action-smoke-cache/value.txt action-smoke-download/nested/value.txt
          test ! -e action-smoke-download/.hidden-probe
      - name: Exercise github-script v9 with read-only current-run metadata
        uses: actions/github-script@v9
        with:
          script: |
            const result = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            const expectedHead = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha : context.sha;
            if (result.data.head_sha !== expectedHead ||
                result.data.event !== context.eventName) throw new Error('Run/head/event mismatch');
            if (typeof github.paginate !== 'function' ||
                typeof github.paginate.iterator !== 'function' ||
                typeof getOctokit !== 'function') throw new Error('Required API helpers missing');
            const rows = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.runId, per_page: 100
            });
            if (!rows.some(job => job.head_sha === expectedHead &&
                job.name === 'Validate targets and scripts')) throw new Error('Current job absent');
            core.info('Read-only action compatibility smoke passed');

