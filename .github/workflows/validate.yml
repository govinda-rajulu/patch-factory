name: 3. Validate
on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  validate:
    name: Validate targets and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: targets.json integrity
        run: |
          jq -e . src/targets.json > /dev/null || { echo "::error::targets.json is not valid JSON"; exit 1; }
          FAIL=0
          while IFS=$'\t' read -r id pd op; do
            for side in include exclude; do
              [ -f "src/patches/$pd/$side-patches" ] || { echo "::error::$id: missing src/patches/$pd/$side-patches"; FAIL=1; }
            done
            F="src/options/$op.json"
            if [ ! -f "$F" ]; then
              echo "::error::$id: missing $F"; FAIL=1
            elif [ "$(jq -r 'type' "$F")" != "array" ]; then
              echo "::error::$F must be a JSON array. morphe-desktop rejects an object."; FAIL=1
            fi
          done < <(jq -r '.[] | . as $t | .candidates[] | [$t.id, .patch_dir, .options] | @tsv' src/targets.json)
          while IFS=$'\t' read -r id tp; do
            [ -n "$tp" ] && [ "$tp" != "null" ] || { echo "::error::$id: enabled target has no tag_prefix"; FAIL=1; }
          done < <(jq -r '.[] | select(.enabled) | [.id, (.tag_prefix // "")] | @tsv' src/targets.json)
          [ "$FAIL" = 0 ] && echo "targets.json OK"
          exit $FAIL
      - name: Shell syntax
        run: |
          for f in src/build/*.sh src/etc/*.sh; do
            bash -n "$f" || { echo "::error::$f failed bash -n"; exit 1; }
          done
          echo "all scripts parse"
      - name: New-field integrity
        run: |
          FAIL=0
          while IFS=$'\t' read -r id host pid; do
            if [ "$host" = "gitlab" ] && { [ "$pid" = "-" ] || [ "$pid" = "null" ]; }; then
              echo "::error::$id: gitlab candidate needs project_id"; FAIL=1
            fi
          done < <(jq -r '.[] | .id as $i | .candidates[] | [$i, (.host // "github"), (.project_id // "-")] | @tsv' src/targets.json)
          while IFS=$'\t' read -r id nm host pid owner repo; do
            [ -n "$nm" ] && [ "$nm" != "null" ] || { echo "::error::$id: extra_bundles entry has no name"; FAIL=1; }
            case "$host" in
              gitlab) [ "$pid" != "-" ] && [ "$pid" != "null" ] || { echo "::error::$id: gitlab extra needs project_id"; FAIL=1; } ;;
              github) [ "$owner" != "-" ] && [ "$repo" != "-" ] || { echo "::error::$id: github extra needs owner and repo"; FAIL=1; } ;;
              *) echo "::error::$id: unknown extra host '$host'"; FAIL=1 ;;
            esac
          done < <(jq -r '.[] | .id as $i | (.extra_bundles // [])[] | [$i, .name, (.host // "github"), (.project_id // "-"), (.owner // "-"), (.repo // "-")] | @tsv' src/targets.json)
          EB=$(jq -r '[.[] | (.extra_bundles // []) | length] | add // 0' src/targets.json)
          echo "extra_bundles declared across all targets: $EB"
          if [ "$EB" -gt 0 ]; then
            [ -f src/build/fetch_bundle.sh ] || { echo "::error::extra_bundles declared but src/build/fetch_bundle.sh is missing"; FAIL=1; }
            grep -q extra_bundles src/build/build.sh || { echo "::error::extra_bundles declared but build.sh never reads it"; FAIL=1; }
            grep -q 'EXTRA_P' src/build/build.sh || { echo "::error::extra_bundles declared but build.sh has no per-bundle -p logic"; FAIL=1; }
          fi
          [ "$FAIL" = 0 ] && echo "new-field integrity OK"
          exit $FAIL
      - name: Exclusive integrity
        run: |
          FAIL=0
          EX=$(jq -r '[.[] | select(.exclusive == true)] | length' src/targets.json)
          echo "targets with exclusive: $EX"
          if [ "$EX" -gt 0 ]; then
            grep -q -- --exclusive src/build/build.sh || { echo "::error::exclusive declared but build.sh never passes --exclusive"; FAIL=1; }
            while IFS=: read -r id pd; do
              [ -s "src/patches/$pd/include-patches" ] || { echo "::error::$id: exclusive needs a non-empty include-patches in $pd"; FAIL=1; }
            done < <(jq -r '.[] | select(.exclusive == true) | .id as $i | .candidates[] | $i + ":" + .patch_dir' src/targets.json)
          fi
          [ "$FAIL" = 0 ] && echo "exclusive integrity OK"
          exit $FAIL
      - name: Extra patch dirs
        run: |
          FAIL=0
          ED=$(jq -r '[.[] | (.extra_bundles // [])[] | select(.patch_dir)] | length' src/targets.json)
          echo "extras declaring patch_dir: $ED"
          if [ "$ED" -gt 0 ]; then
            [ -f src/build/selections.sh ] || { echo "::error::extra patch_dir declared but selections.sh is missing"; FAIL=1; }
            grep -q selections.sh src/build/build.sh || { echo "::error::extra patch_dir declared but build.sh never calls selections.sh"; FAIL=1; }
            while IFS=: read -r id nm pd; do
              for side in include exclude; do
                [ -f "src/patches/$pd/$side-patches" ] || { echo "::error::$id/$nm: missing src/patches/$pd/$side-patches"; FAIL=1; }
              done
            done < <(jq -r '.[] | .id as $i | (.extra_bundles // [])[] | select(.patch_dir) | $i + ":" + .name + ":" + .patch_dir' src/targets.json)
          fi
          [ "$FAIL" = 0 ] && echo "extra patch dirs OK"
          exit $FAIL
      - name: Dropdown coverage
        run: |
          FAIL=0
          W=.github/workflows/manual-patch.yml
          while read -r id; do
            grep -q -- "- '$id'" "$W" || { echo "::error::$id is enabled but missing from the target dropdown in $W"; FAIL=1; }
          done < <(jq -r '.[] | select(.enabled) | .id' src/targets.json)
          [ "$FAIL" = 0 ] && echo "dropdown covers every enabled target"
          exit $FAIL
