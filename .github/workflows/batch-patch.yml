name: 6. Batch Patch
run-name: Batch ${{ inputs.targets }} / publish=${{ inputs.publish }}
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish releases (false is a nonpublishing smoke batch)'
        required: false
        type: boolean
        default: true
      targets:
        description: 'Comma-separated target ids'
        required: true
        type: string
jobs:
  fan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Resolve ids
        id: plan
        env:
          RAW: ${{ inputs.targets }}
        run: bash src/etc/batchplan.sh
  build:
    needs: fan
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.fan.outputs.matrix) }}
    uses: ./.github/workflows/manual-patch.yml
    with:
      target: ${{ matrix.target }}
      publish: ${{ inputs.publish }}
    secrets: inherit
