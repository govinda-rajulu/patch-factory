name: 9. Batch Patch
run-name: Batch ${{ inputs.targets }} / publish=${{ inputs.publish }}
permissions: {}
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish releases (false is a nonpublishing smoke batch)'
        required: false
        type: boolean
        default: true
      targets:
        description: 'Comma-separated target ids'
        required: true
        type: string
jobs:
  fan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve ids
        id: plan
        env:
          RAW: ${{ inputs.targets }}
        run: bash src/etc/batchplan.sh
  build:
    needs: fan
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.fan.outputs.matrix) }}
    permissions:
      contents: write
    uses: ./.github/workflows/manual-patch.yml
    with:
      target: ${{ matrix.target }}
      publish: ${{ inputs.publish }}
    secrets:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
