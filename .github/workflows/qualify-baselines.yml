name: Qualify published shadow baselines
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] success, main branch, and repository guards
    workflows: ['2. Check new patch', '1. Manual Patch', '9. Batch Patch']
    types: [completed]
    # W16k: main only; packet and adopt smokes never publish, they only started skipped runs.
    branches: [main]
permissions:
  contents: read
jobs:
  # W16i (owner, 25 Oct 2026): qualify reads every release, so a burst of publications needs
  # one pass, after the last. A newer qualifying trigger cancels this wait; the real job then
  # skips. Only main successes wait, so a branch smoke can never cancel a main qualification.
  settle:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: qualify-settle
      cancel-in-progress: true
    steps:
      - name: Let related publications settle
        run: sleep 180
  qualify:
    needs: settle
    if: needs.settle.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: qualify
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted default-branch code, never the source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Qualify only exact completed successful publication receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/build/qualified_baselines.py
      - name: Preserve qualification results (no APKs or secrets)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: baseline-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow-qualified/
          if-no-files-found: warn
          retention-days: 30
