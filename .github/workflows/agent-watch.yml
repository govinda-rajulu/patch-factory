name: 6. Provider watch
# Name-only observations. Baselines never advance on observation or reporting.
permissions:
  contents: read
  issues: write
on:
  schedule:
    - cron: "37 6 * * 1"  # 12:07 IST Monday
  workflow_dispatch:
jobs:
  watch:
    name: Provider watch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Collect provider observations and coverage
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/etc/provider_watch.py collect
      - name: Preserve provider watch evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            provider-watch-evidence/report.json
            provider-watch-evidence/report.md
          if-no-files-found: error
          retention-days: 30
      - name: Report changes or incomplete observations
        if: ${{ !cancelled() && steps.observe.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/etc/provider_watch.py issue
      - name: Enforce complete observation coverage
        if: ${{ !cancelled() }}
        run: python3 src/etc/provider_watch.py enforce
