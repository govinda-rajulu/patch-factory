name: 6. Provider watch
# Name-only observations. Baselines never advance on observation or reporting.
permissions:
  contents: read
  issues: write
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
jobs:
  watch:
    name: Provider watch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Collect provider observations and coverage
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/etc/provider_watch.py collect
      - name: Preserve provider watch evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: provider-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            provider-watch-evidence/report.json
            provider-watch-evidence/report.md
          if-no-files-found: error
          retention-days: 30
      - name: Report changes or incomplete observations
        if: ${{ !cancelled() && steps.observe.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/etc/provider_watch.py issue
      - name: Enforce complete observation coverage
        if: ${{ !cancelled() }}
        run: python3 src/etc/provider_watch.py enforce
