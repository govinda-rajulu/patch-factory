name: 7. Nightly watch
permissions:
  contents: read
  issues: write
on:
  schedule:
    - cron: "41 1 * * *"  # 07:11 IST daily
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with: { distribution: temurin, java-version: '21' }
      - name: Fetch patcher
        id: patcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 src/build/github_patcher.py .
      - name: Collect full redacted report and coverage status
        id: rep
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_SETUP: ${{ steps.patcher.outcome }}
        run: python3 src/etc/nightly_report.py collect
      - name: Preserve Nightly Watch evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            watch-evidence/nightly-report.txt
            watch-evidence/nightly-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Open an issue only if something changed
        if: ${{ !cancelled() && steps.rep.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_REPORT: .nightly-report.txt
        run: bash src/etc/watch_issue.sh
      - name: Enforce report result (coverage listed separately)
        if: ${{ !cancelled() }}
        run: python3 src/etc/nightly_report.py enforce
