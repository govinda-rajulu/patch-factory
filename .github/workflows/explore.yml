name: 4. Explore patches
permissions:
  contents: read
  issues: write
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Provider host'
        required: true
        default: 'github'
        type: choice
        options:
          - 'github'
          - 'gitlab'
      ident:
        description: 'OWNER/REPO for github, numeric project id for gitlab'
        required: true
        type: string
      package:
        description: 'Package name, e.g. com.truecaller'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - 'prerelease'
          - 'latest'
jobs:
  explore:
    name: Explore ${{ inputs.ident }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse a malformed provider or package
        # W7 (desk lead): inputs reach a shell, an issue title and the patcher; accept only their real shapes.
        env:
          HOST: ${{ inputs.host }}
          IDENT: ${{ inputs.ident }}
          PKG: ${{ inputs.package }}
        run: |
          if ! [[ "$PKG" =~ ^[A-Za-z][A-Za-z0-9_]*([.][A-Za-z][A-Za-z0-9_]*)+$ ]] || [ "${#PKG}" -gt 120 ]; then
            echo "::error::package must look like com.example.app"; exit 1
          fi
          if [ "$HOST" = "gitlab" ]; then
            if ! [[ "$IDENT" =~ ^[0-9]{1,12}$ ]]; then echo "::error::gitlab ident must be a numeric project id"; exit 1; fi
          elif ! [[ "$IDENT" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::github ident must be OWNER/REPO"; exit 1
          fi
          echo "inputs accepted: $HOST $IDENT $PKG"
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Download morphe-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          META=$(python3 src/build/github_patcher.py .) || { echo "::error::verified patcher download failed"; exit 1; }
          echo "PATCHER_VERIFIED $META"
          JAR=$(jq -er '.name' <<<"$META")
          [ -f "$JAR" ] || { echo "::error::verified patcher jar missing"; exit 1; }
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "verified jar: $JAR ($(wc -c < "$JAR") bytes)"
        id: patcher
      - name: Fetch bundle
        id: fetch
        env:
          HOST: ${{ inputs.host }}
          IDENT: ${{ inputs.ident }}
          PKG: ${{ inputs.package }}
          CHAN: ${{ inputs.channel }}
        run: |
          # W16f tried the other channel once. W16h (wrong call 59): legendsciber failed because its release carries two .mpp files; fetch picks the one named for the tag (pick_mpp).
          # W16h: the first status is printed, never swallowed, and the issue names the channel that served it.
          USED="$CHAN"; RC=0
          bash src/build/fetch_bundle.sh "$HOST" "$IDENT" "$CHAN" ./explore.mpp || RC=$?
          if [ "$RC" -ne 0 ] || [ ! -f ./explore.mpp ] || [ "$(wc -c < ./explore.mpp)" -le 10000 ]; then
            if [ "$CHAN" = "prerelease" ]; then OTHER=latest; else OTHER=prerelease; fi
            echo "::warning::no bundle on $CHAN (fetch status $RC); trying $OTHER"
            rm -f ./explore.mpp
            bash src/build/fetch_bundle.sh "$HOST" "$IDENT" "$OTHER" ./explore.mpp
            USED="$OTHER"
          fi
          echo "channel=$USED" >> "$GITHUB_OUTPUT"
          S=$(wc -c < ./explore.mpp); echo "bundle bytes: $S"
          [ "$S" -gt 10000 ] || { echo "::error::bundle too small, fetch failed"; exit 1; }
      - name: List patches
        env:
          HOST: ${{ inputs.host }}
          IDENT: ${{ inputs.ident }}
          PKG: ${{ inputs.package }}
          CHAN: ${{ inputs.channel }}
        run: |
          set -o pipefail
          java -jar "${{ steps.patcher.outputs.jar }}" list-patches --patches ./explore.mpp \
            --with-packages --with-versions --with-options \
            --filter-package-name "$PKG" --out ./patches.txt 2>&1 | tail -3
          [ -s ./patches.txt ] || { echo "::error::no patches for $PKG in this bundle"; exit 1; }
          NA=$(grep -c '^Name: ' ./patches.txt); NE=$(grep -c '^Enabled: ' ./patches.txt)
          echo "names: $NA enabled-lines: $NE"
          [ "$NA" = "$NE" ] || { echo "::error::parse mismatch, $NA names vs $NE enabled lines"; exit 1; }
      - name: Open issue
        env:
          HOST: ${{ inputs.host }}
          IDENT: ${{ inputs.ident }}
          PKG: ${{ inputs.package }}
          CHAN: ${{ steps.fetch.outputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(grep -c '^Name: ' ./patches.txt)
          {
            echo "Bundle: $HOST $IDENT ($CHAN)"
            echo "Package: $PKG"
            echo "Patches: $N"
            echo ""
            echo "name | default"
            # Provider-supplied names go inside a code fence: no @mentions, links or markup.
            echo '```text'
            paste -d'|' <(grep '^Name: ' ./patches.txt | sed 's/^Name: //') <(grep '^Enabled: ' ./patches.txt | sed 's/^Enabled: //') | tr '`' "'"
            echo '```'
          } > body.md
          wc -c body.md
          gh issue create --title "patches: $PKG via $IDENT" --body-file body.md
