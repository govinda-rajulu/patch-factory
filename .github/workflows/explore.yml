name: 4. Explore patches
permissions:
  contents: read
  issues: write
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Provider host'
        required: true
        default: 'github'
        type: choice
        options:
          - 'github'
          - 'gitlab'
      ident:
        description: 'OWNER/REPO for github, numeric project id for gitlab'
        required: true
        type: string
      package:
        description: 'Package name, e.g. com.truecaller'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - 'prerelease'
          - 'latest'
jobs:
  explore:
    name: Explore ${{ inputs.ident }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Download morphe-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          META=$(python3 src/build/github_patcher.py .) || { echo "::error::verified patcher download failed"; exit 1; }
          echo "PATCHER_VERIFIED $META"
          JAR=$(jq -er '.name' <<<"$META")
          [ -f "$JAR" ] || { echo "::error::verified patcher jar missing"; exit 1; }
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "verified jar: $JAR ($(wc -c < "$JAR") bytes)"
        id: patcher
      - name: Fetch bundle
        env:
          HOST: ${{ inputs.host }}
          IDENT: ${{ inputs.ident }}
          PKG: ${{ inputs.package }}
          CHAN: ${{ inputs.channel }}
        run: |
          bash src/build/fetch_bundle.sh "$HOST" "$IDENT" "$CHAN" ./explore.mpp
          S=$(wc -c < ./explore.mpp); echo "bundle bytes: $S"
          [ "$S" -gt 10000 ] || { echo "::error::bundle too small, fetch failed"; exit 1; }
      - name: List patches
        env:
          HOST: ${{ inputs.host }}
          IDENT: ${{ inputs.ident }}
          PKG: ${{ inputs.package }}
          CHAN: ${{ inputs.channel }}
        run: |
          java -jar "${{ steps.patcher.outputs.jar }}" list-patches --patches ./explore.mpp \
            --with-packages --with-versions --with-options \
            --filter-package-name "$PKG" --out ./patches.txt 2>&1 | tail -3
          [ -s ./patches.txt ] || { echo "::error::no patches for $PKG in this bundle"; exit 1; }
          NA=$(grep -c '^Name: ' ./patches.txt); NE=$(grep -c '^Enabled: ' ./patches.txt)
          echo "names: $NA enabled-lines: $NE"
          [ "$NA" = "$NE" ] || { echo "::error::parse mismatch, $NA names vs $NE enabled lines"; exit 1; }
      - name: Open issue
        env:
          HOST: ${{ inputs.host }}
          IDENT: ${{ inputs.ident }}
          PKG: ${{ inputs.package }}
          CHAN: ${{ inputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(grep -c '^Name: ' ./patches.txt)
          {
            echo "Bundle: $HOST $IDENT ($CHAN)"
            echo "Package: $PKG"
            echo "Patches: $N"
            echo ""
            echo "name | default"
            echo ""
            paste -d'|' <(grep '^Name: ' ./patches.txt | sed 's/^Name: //') <(grep '^Enabled: ' ./patches.txt | sed 's/^Enabled: //')
          } > body.md
          wc -c body.md
          gh issue create --title "patches: $PKG via $IDENT" --body-file body.md
