name: Onboarding review
# W15d: the run name carries the pull request number, so 11. Rule merge can find it.
# W15e: quoted. Unquoted, YAML read " #" as a comment and every run was named "Onboarding review" (L069).
run-name: "Onboarding review #${{ inputs.pr || github.event.pull_request.number }}"
# Packet W1/W2 (8 Oct 2026): every pull request that adds an app, a provider or a patch name
# must pass a written onboarding record (deterministic) and an agent review (council seats).
# Job 1 reads the pull request as data with the BASE checkout's checker and no model keys.
# Job 2 runs the base's reviewer with the model keys and sees only job 1's manifest.
# "5. Add target" opens its pull requests with the workflow token, which starts no other
# workflow, so it dispatches this one with the pull request number; both paths resolve the
# same base and head commits. Neither job pushes, merges or publishes.
# See docs/review/onboarding/README.md.
permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/targets.json'
      - 'src/patches/**'
      - 'src/options/**'
      - 'docs/review/onboarding/**'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true
        type: string
concurrency:
  group: onboard-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  record:
    name: Onboarding record
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      pr: ${{ steps.pr.outputs.number }}
      base: ${{ steps.pr.outputs.base }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          N="${EVENT_PR:-$INPUT_PR}"
          if ! printf '%s' "$N" | grep -Eq '^[0-9]{1,7}$'; then echo "::error::pull request number '$N' is not a number"; exit 1; fi
          gh api "repos/$REPO/pulls/$N" > pr.json
          if [ "$(jq -r .state pr.json)" != "open" ]; then echo "::error::pull request $N is not open"; exit 1; fi
          {
            echo "number=$N"
            echo "base=$(jq -r .base.sha pr.json)"
            echo "head=$(jq -r .head.sha pr.json)"
            echo "head_repo=$(jq -r .head.repo.full_name pr.json)"
            echo "author=$(jq -r .user.login pr.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout the base (the checker that runs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base }}
          path: base
          persist-credentials: false
      - name: Fetch the pull request's data files only (no code on disk)
        # W15i (CodeQL actions/cache-poisoning/poisonable-step, 23 Oct 2026): the checker only
        # ever READ the head (src/targets.json, src/patches, docs/review/onboarding; stdlib only,
        # run from base/), so the alert was a false alarm. The head is now not checked out at
        # all: those three paths come out of the commit's tarball, nothing else lands on disk,
        # and a link or a path outside them stops the job.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then echo "::error::head '$HEAD_SHA' is not a commit id"; exit 1; fi
          gh api "repos/$REPO/tarball/$HEAD_SHA" > head.tgz
          mkdir head
          tar -xzf head.tgz -C head --strip-components=1 --no-same-owner --no-same-permissions --wildcards \
            '*/src/targets.json' '*/src/patches/*' '*/docs/review/onboarding/*'
          rm -f head.tgz
          if [ -n "$(find head -type l -print -quit)" ]; then echo "::error::the pull request carries a link in its data files"; exit 1; fi
          if [ -n "$(find head -type f ! -path 'head/src/targets.json' ! -path 'head/src/patches/*' ! -path 'head/docs/review/onboarding/*' -print -quit)" ]; then echo "::error::unexpected file outside the data paths"; exit 1; fi
          test -f head/src/targets.json
      - name: Check onboarding records
        id: check
        env:
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          REPO_OWNER: ${{ github.repository_owner }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          THIS_REPO: ${{ github.repository }}
        run: |
          mkdir -p onboard-manifest
          if [ ! -f base/src/etc/onboard_check.py ]; then
            echo "onboarding checker is not on the base commit yet"
            echo '{"onboarding": false, "problems": []}' > onboard-manifest/manifest.json
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          # W16k: the owner's own pull request also reads its head policy (ADOPT paid_ok, DECISIONS takes).
          OWNER_FLAG=""
          if [ "$PR_AUTHOR" = "$REPO_OWNER" ] && [ "$HEAD_REPO" = "$THIS_REPO" ]; then OWNER_FLAG="--owner-pr"; fi
          # The checker runs from the BASE: a base older than W16k has no such flag, so it is not passed.
          if ! grep -q -- "--owner-pr" base/src/etc/onboard_check.py; then OWNER_FLAG=""; fi
          python3 base/src/etc/onboard_check.py --base base --head head --manifest onboard-manifest/manifest.json $OWNER_FLAG
      - name: Keep the manifest for the agent review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: onboard-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: onboard-manifest/manifest.json
          if-no-files-found: error
          retention-days: 7
  agents:
    name: Agent review (required for onboarding)
    needs: record
    if: always() && needs.record.result != 'cancelled' && needs.record.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Refuse fork and bot pull requests (no keys there)
        if: needs.record.outputs.head_repo != github.repository || github.actor == 'dependabot[bot]'
        run: |
          echo "::error::agent review needs the model keys, which fork and bot pull requests never receive; push the branch to this repository"
          exit 1
      - name: Checkout the reviewed base, never the pull request's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.record.outputs.base }}
          persist-credentials: false
      - name: Download this run's manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onboard-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: onboard-manifest/
          digest-mismatch: error
      - name: Convene the onboarding review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          PF_REPO: ${{ github.repository }}
          PF_PR: ${{ needs.record.outputs.pr }}
          PF_MANIFEST: onboard-manifest/manifest.json
        run: python3 src/council/onboard_review.py
  wake:
    # W15e (L069): a run the bot starts wakes no workflow_run, so the review wakes 11. Rule merge
    # itself. Rule merge runs main's own code and decides; this job only starts it.
    name: Wake Rule merge
    needs: agents
    if: always() && needs.agents.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Start 11. Rule merge on main
        env:
          GH_TOKEN: ${{ github.token }}
          PF_REPO: ${{ github.repository }}
        run: gh workflow run rule-merge.yml --repo "$PF_REPO" --ref main
