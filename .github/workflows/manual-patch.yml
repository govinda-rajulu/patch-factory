name: 1. Manual Patch
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release (false runs a nonpublishing smoke test)'
        required: false
        default: true
        type: boolean
      target:
        description: 'Which target do you want to patch?'
        required: true
        default: 'youtube'
        type: choice
        options:
          - 'youtube'
          - 'adguard'
          - 'photos'
          - 'truecaller-combo'
          - 'primevideo'
          - 'esfile'
          - 'facebook'
          - 'instagram'
          - 'reddit'
          - 'hotstar'
          - 'edge'
          - 'mxplayer'
          - 'telegram'
          - 'keymapper'
  workflow_call:
    inputs:
      shadow_plan_required:
        description: Distinguish a missing daily Plan from an intentional direct/manual build
        required: false
        type: boolean
        default: false
      shadow_plan_key:
        description: Optional shadow declaration from the daily Plan, never a skip instruction
        required: false
        type: string
        default: ''
      publish:
        required: false
        type: boolean
        default: true
      target:
        required: true
        type: string
jobs:
  patch:
    name: Patch ${{ inputs.target }}
    concurrency:
      group: patch-${{ inputs.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      repository: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      COE: ${{ vars.COE }}
      PF_SHADOW_PLAN_KEY: ${{ inputs.shadow_plan_key || '' }}
      PF_SHADOW_PLAN_REQUIRED: ${{ inputs.shadow_plan_required || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Preflight before secrets and downloads
        env:
          TARGET: ${{ inputs.target }}
        run: python3 src/etc/preflight.py "$TARGET"
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > src/ks.keystore
          SZ=$(wc -c < src/ks.keystore)
          echo "keystore bytes: $SZ"
          [ "$SZ" -gt 3000 ] || { echo "::error::keystore truncated - KEYSTORE_B64 secret is incomplete"; exit 1; }
      - name: Cache the patcher jar
        uses: actions/cache@v4
        with:
          path: morphe-desktop-*.jar
          key: morphe-jar-${{ hashFiles('src/targets.json') }}
          restore-keys: morphe-jar-
      - name: Preparing to patch
        uses: ./.github/actions/preparing
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Fail if no connection
        if: steps.check-gh.outputs.internet_error != '0'
        run: echo "::error::connection.sh reported a problem, refusing to skip the build"; exit 1
      - name: Patch apk
        if: steps.check-gh.outputs.internet_error == '0'
        env:
          TARGET: ${{ inputs.target }}
        run: bash src/build/build.sh "$TARGET"
      - name: Verify finished APK identity
        env:
          TARGET: ${{ inputs.target }}
        run: python3 src/build/artifact_identity.py verify "$TARGET"
      - name: Save build evidence (JSON only)
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ inputs.target }}
          path: build-evidence/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify release handoff (no publishing)
        env:
          TARGET: ${{ inputs.target }}
        run: python3 src/build/release_contract.py "$TARGET"
      - name: Compare consumed inputs in shadow mode
        id: shadow
        continue-on-error: true
        timeout-minutes: 3
        env:
          TARGET: ${{ inputs.target }}
        run: python3 src/build/shadow_inputs.py observe "$TARGET"
      - name: Preserve shadow consumed-input comparison
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shadow-inputs-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save verified test APK and evidence (not a release)
        if: success() && (!inputs.publish || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: test-apk-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/*.apk
            build-evidence/${{ inputs.target }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Releasing APK files
        if: steps.check-gh.outputs.internet_error == '0' && inputs.publish && github.ref == 'refs/heads/main'
        uses: ./.github/actions/release
        with:
          target: ${{ inputs.target }}
      - name: Nonpublishing smoke result
        if: steps.check-gh.outputs.internet_error == '0' && (!inputs.publish || github.ref != 'refs/heads/main')
        run: |
          echo "SMOKE PASSED: APK built and locally checked; release and prune were skipped."
          echo "No APK was installed on a phone."
