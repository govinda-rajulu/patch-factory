name: 1. Manual Patch
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which target do you want to patch?'
        required: true
        default: 'youtube'
        type: choice
        options:
          - 'youtube'
          - 'photos'
          - 'truecaller'
          - 'truecaller-combo'
          - 'adguard'
          - 'primevideo'
          - 'esfile'
          - 'facebook'
          - 'instagram'
          - 'reddit'
          - 'hotstar'
          - 'sonyliv'
          - 'zee5'
          - 'edge'
          - 'mxplayer'
          - 'telegram'
          - 'keymapper'
  workflow_call:
    inputs:
      target:
        required: true
        type: string
jobs:
  patch:
    name: Patch ${{ inputs.target }}
    runs-on: ubuntu-latest
    env:
      repository: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > src/ks.keystore
          SZ=$(wc -c < src/ks.keystore)
          echo "keystore bytes: $SZ"
          [ "$SZ" -gt 3000 ] || { echo "::error::keystore truncated - KEYSTORE_B64 secret is incomplete"; exit 1; }
      - name: Preparing to patch
        uses: ./.github/actions/preparing
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Patch apk
        if: steps.check-gh.outputs.internet_error == '0'
        env:
          TARGET: ${{ inputs.target }}
        run: bash src/build/build.sh "$TARGET"
      - name: Releasing APK files
        if: steps.check-gh.outputs.internet_error == '0'
        uses: ./.github/actions/release
