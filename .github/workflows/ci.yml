name: 2. Check new patch
permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "30 12 * * 5"
  workflow_dispatch:

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    env:
      repository: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Fail if no connection
        if: steps.check-gh.outputs.internet_error != '0'
        run: echo "::error::no github connection" && exit 1
      - name: Poll every opted-in target
        id: plan
        run: |
          set -uo pipefail
          mapfile -t IDS < <(jq -r '.[] | select(.enabled != false) | select((.poll // false) == true) | .id' src/targets.json)
          echo "opted in: ${IDS[*]:-none}"
          WANT=()
          for id in "${IDS[@]:-}"; do
            [ -n "$id" ] || continue
            OUT=$(mktemp)
            GITHUB_OUTPUT="$OUT" bash src/etc/poll.sh "$id" || echo "  $id: poll exited non-zero, skipping"
            NEW=$(grep -E '^new_patch=' "$OUT" | tail -1 | cut -d= -f2)
            echo "  $id: new_patch=${NEW:-0}"
            [ "${NEW:-0}" = "1" ] && WANT+=("$id")
            rm -f "$OUT"
          done
          COUNT=${#WANT[@]}
          MATRIX=$(printf '%s\n' "${WANT[@]:-}" | jq -R . | jq -sc '{target: map(select(length>0))}')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "planned $COUNT target(s): $MATRIX"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      target: ${{ matrix.target }}
