name: 2. Check new patch
permissions: write-all

on:
  schedule:
    - cron: "30 12 * * 5"
  workflow_dispatch:

jobs:
  check:
    name: Check new patch
    runs-on: ubuntu-latest
    env:
      repository: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Check new patch Morphe
        id: check-morphe
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh MorpheApp/morphe-patches prerelease youtube-arm64-v8a-morphe
    outputs:
      check_morphe: ${{ steps.check-morphe.outputs.new_patch }}

  Patch-Morphe:
    name: Patch Morphe
    needs: check
    if: ${{ needs.check.outputs.check_morphe == 1 }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Morphe"