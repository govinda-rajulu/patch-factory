name: 2. Check new patch
permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      shadow_keys: ${{ steps.shadow.outputs.keys }}
      resolution_matrix: ${{ steps.shadow.outputs.resolution_matrix }}
    env:
      repository: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Fail if no connection
        if: steps.check-gh.outputs.internet_error != '0'
        run: echo "::error::no github connection" && exit 1
      - name: Poll every opted-in target
        id: plan
        run: python3 src/etc/daily_plan.py
      - name: Record shadow Plan declarations (not build selection)
        id: shadow
        continue-on-error: true
        timeout-minutes: 3
        run: python3 src/build/shadow_inputs.py plan
      - name: Preserve shadow Plan evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shadow-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow-evidence/plan.json
          if-no-files-found: warn
          retention-days: 30

  resolve:
    name: Resolve shadow dependencies (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.resolution_matrix != ''
    # Observe every opted-in target, including those omitted by the old poller.
    # Resolver failures are UNKNOWN evidence, never authority to change its matrix.
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.resolution_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up resolver Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Resolve exact dependency files (no APK or signing)
        env:
          TARGET: ${{ matrix.target }}
        run: python3 src/build/resolved_inputs.py prepare "$TARGET"
      - name: Preserve exact target dependency packet
        # Unbuilt targets retain the JSON observation, not duplicated large JARs.
        if: contains(fromJSON(needs.plan.outputs.matrix).target, matrix.target)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resolved-inputs-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: resolved-inputs/
          if-no-files-found: error
          retention-days: 2
      - name: Prepare existing store download services without signing
        id: source_services
        continue-on-error: true
        uses: ./.github/actions/preparing
      - name: Resolve exact patcher-input APK (shadow only)
        id: source_resolve
        if: steps.source_services.outcome == 'success'
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
        run: python3 src/build/source_inputs.py prepare "$TARGET"
      - name: Preserve prepared APK only for the unchanged legacy build matrix
        if: steps.source_resolve.outcome == 'success' && contains(fromJSON(needs.plan.outputs.matrix).target, matrix.target)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-inputs-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-inputs/
          if-no-files-found: error
          retention-days: 2
      - name: Compare prepared dependencies with qualified publication (shadow only)
        if: always() && !cancelled()
        continue-on-error: true
        timeout-minutes: 5
        env:
          TARGET: ${{ matrix.target }}
        run: python3 src/build/dependency_observation.py observe "$TARGET"
      - name: Compare exact prepared APK with qualified publication (shadow only)
        if: always() && !cancelled()
        continue-on-error: true
        timeout-minutes: 5
        env:
          TARGET: ${{ matrix.target }}
        run: python3 src/build/source_inputs.py observe "$TARGET"
      - name: Preserve every resolution observation or explicit unknown
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-observation-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-observation/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve every dependency resolution observation or explicit unknown
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resolved-observation-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: resolved-observation/
          if-no-files-found: warn
          retention-days: 30

  dependency_report:
    name: Prepared dependency comparison (not build selection)
    needs: [plan, resolve]
    if: always() && !cancelled() && needs.plan.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout report code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this attempt's small observations only
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: resolved-observation-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-observations/
          merge-multiple: false
          digest-mismatch: error
      - name: Account for every expected target including missing observations
        if: always()
        run: python3 src/build/dependency_observation.py aggregate
      - name: Retain the bounded comparison report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-report/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Download this attempt's source observations only
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: source-observation-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-observations/
          merge-multiple: false
          digest-mismatch: error
      - name: Report source preparation and comparison separately
        if: always()
        run: python3 src/build/source_report.py
      - name: Retain bounded source coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-report/report.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [plan, resolve]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      target: ${{ matrix.target }}
      shadow_plan_key: ${{ fromJSON(needs.plan.outputs.shadow_keys || '{}')[matrix.target] || '' }}
      shadow_plan_required: true
      resolved_requested: true
