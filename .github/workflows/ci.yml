name: 2. Check new patch
permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    env:
      repository: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Fail if no connection
        if: steps.check-gh.outputs.internet_error != '0'
        run: echo "::error::no github connection" && exit 1
      - name: Poll every opted-in target
        id: plan
        run: python3 src/etc/daily_plan.py

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      target: ${{ matrix.target }}
