name: 5. Add target
# 8 Oct 2026 (packet W2): ONE form for every app and patch change, so a change is two steps:
# 1. run this workflow, 2. merge the pull request it opens once "3. Validate" and
# "Onboarding review" are green. It runs src/etc/app.py (the same tool works locally),
# which writes targets.json, the patch folder, options, apps.json, the onboarding record and
# every generated file, and runs the repo checks. Inputs reach the tool only as environment
# variables. It never pushes to main, merges, builds or publishes.
# How-to and the patch rule: docs/APPS.md.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: 'add'
        type: choice
        options:
          - 'add'
          - 'patch'
          - 'disable'
          - 'enable'
          - 'remove'
      id:
        description: 'App id, lowercase, e.g. amazonmusic'
        required: true
        type: string
      package:
        description: 'add: Android package, e.g. com.amazon.mp3'
        required: false
        default: ''
        type: string
      label:
        description: 'add: name people see, e.g. Amazon Music'
        required: false
        default: ''
        type: string
      provider:
        description: 'add: patch provider on GitHub, OWNER/REPO'
        required: false
        default: ''
        type: string
      patches:
        description: 'add or patch: patch names separated by ; (prefix - to drop or exclude one)'
        required: false
        default: ''
        type: string
      source:
        description: 'add: where the original APK comes from'
        required: false
        default: 'apkmirror-bundle'
        type: choice
        options:
          - 'apkmirror-bundle'
          - 'apkmirror-apk'
          - 'apkpure'
      store_url:
        description: 'add: APKMirror uploads list URL or APKPure download URL'
        required: false
        default: ''
        type: string
      needs_microg:
        description: 'add: the patched app signs in through MicroG RE (GmsCore support)'
        required: false
        default: false
        type: boolean
      approve_confirm:
        description: 'I approve the CONFIRM-listed patch names in this request'
        required: false
        default: false
        type: boolean
concurrency:
  group: app-change
  cancel-in-progress: false
jobs:
  change:
    name: ${{ inputs.action }} ${{ inputs.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make the change (src/etc/app.py)
        env:
          PF_ACTION: ${{ inputs.action }}
          PF_ID: ${{ inputs.id }}
          PF_PACKAGE: ${{ inputs.package }}
          PF_LABEL: ${{ inputs.label }}
          PF_PROVIDER: ${{ inputs.provider }}
          PF_PATCHES: ${{ inputs.patches }}
          PF_SOURCE: ${{ inputs.source }}
          PF_STORE_URL: ${{ inputs.store_url }}
          PF_NEEDS_MICROG: ${{ inputs.needs_microg }}
          PF_APPROVE_CONFIRM: ${{ inputs.approve_confirm }}
          PF_SUMMARY: pr-body.md
        run: |
          python3 src/etc/app.py from-env
          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open the pull request and start its checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PF_ACTION: ${{ inputs.action }}
          PF_ID: ${{ inputs.id }}
        run: |
          B="app/$PF_ACTION-$PF_ID-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$B"
          # Workflow files are never staged: this token cannot push them. dropgen keeps the
          # build input free text, so no app change needs one.
          if ! git diff --quiet -- .github; then
            echo "::error::the change touched a workflow file, which this token cannot push; nothing pushed"
            git diff --stat -- .github
            exit 1
          fi
          git add -A -- src docs README.md CREDITS.md
          if git diff --cached --quiet; then
            echo "::warning::nothing changed; no pull request"
            exit 0
          fi
          git commit -m "apps: $PF_ACTION $PF_ID (5. Add target run $GITHUB_RUN_ID)"
          git push origin "$B"
          if gh pr create --repo "$REPO" --base main --head "$B" --title "apps: $PF_ACTION $PF_ID" --body-file pr-body.md > pr-url.txt; then
            PR="$(gh pr view "$B" --repo "$REPO" --json number --jq .number)"
            echo "Pull request: $(cat pr-url.txt)" >> "$GITHUB_STEP_SUMMARY"
            if ! gh workflow run validate.yml --repo "$REPO" --ref "$B"; then echo "::warning::could not start 3. Validate on $B; run it from the Actions tab"; fi
            if ! gh workflow run onboard-review.yml --repo "$REPO" --ref main -f pr="$PR"; then echo "::warning::could not start Onboarding review for pull request $PR"; fi
          else
            echo "::warning::GitHub refused to let Actions open the pull request (Settings, Actions, General: allow GitHub Actions to create pull requests). Open it yourself: https://github.com/$REPO/compare/main...$B"
            echo "Open the pull request: https://github.com/$REPO/compare/main...$B" >> "$GITHUB_STEP_SUMMARY"
          fi
