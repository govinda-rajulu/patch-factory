name: Verified bug
description: A reproduced defect with evidence. Failure reports from workflows arrive on their own; use this only once a cause is shown.
title: "Bug: "
labels: ["bug", "verified"]
body:
  - type: textarea
    id: actual
    attributes:
      label: Expected and actual
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Run, job and attempt (or app, version and phone)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The quoted log line or file and line. Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suspected place and pass condition
