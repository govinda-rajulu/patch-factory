version: 2
updates:
  # Only github-actions. There is no Dockerfile and no package manifest in this repo,
  # so the docker and pip ecosystems would find nothing.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # W15: no labels line; the "dependencies" label never existed, so every PR warned.
    groups:
      # Routine updates travel together; majors are individual reviewable PRs.
      # No ignored majors and no automatic merge. Validate exercises actual refs.
      action-maintenance:
        patterns: ["*"]
        update-types: ["minor", "patch"]
