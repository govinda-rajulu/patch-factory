version: 2
updates:
  # Only github-actions. There is no Dockerfile. The one Python manifest,
  # src/build/helper/ggplay_dl/requirements.txt, names no versions and belongs to the Google
  # Play helper that no build calls (W15i, 23 Oct 2026), so a pip entry would find nothing.
  - package-ecosystem: "github-actions"
    # W15b (20 Oct 2026, #188): composite actions live in .github/actions/*; "/" alone never
    # reaches them, so a bump left .github/actions/preparing on the old setup-java and Validate
    # refused the mixed pins (test_repair). Every composite folder is covered here.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # W15: no labels line; the "dependencies" label never existed, so every PR warned.
    groups:
      # Routine updates travel together; majors are individual reviewable PRs.
      # No ignored majors and no automatic merge. Validate exercises actual refs.
      action-maintenance:
        patterns: ["*"]
        update-types: ["minor", "patch"]
