name: Releasing APK files
runs:
  using: "composite"
  steps:
    - name: Read build metadata
      id: meta
      shell: bash
      run: |
        V=$(cat ./release/.version 2>/dev/null || echo "")
        P=$(cat ./release/.tagprefix 2>/dev/null || echo "")
        if [ -z "$V" ] || [ -z "$P" ]; then
          echo "::error::missing ./release/.version or ./release/.tagprefix"
          exit 1
        fi
        echo "version=$V" >> $GITHUB_OUTPUT
        echo "prefix=$P"  >> $GITHUB_OUTPUT
        S=$(cat ./release/.tagsuffix 2>/dev/null || echo "")
        echo "tag=$P-v$V$S" >> $GITHUB_OUTPUT
        echo "suffix=$S" >> $GITHUB_OUTPUT
        R=$(cat ./release/.provider 2>/dev/null || echo "")
        [ -n "$R" ] || R="Morphe"
        echo "provider=$R" >> $GITHUB_OUTPUT
        PV=$(cat ./release/.patchver 2>/dev/null || echo unknown)
        echo "patchver=$PV" >> $GITHUB_OUTPUT
        echo "building release tag: $P-v$V$S"
        ls -la ./release/

    - name: Release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: "./release/*-arm64-v8a.apk"
        tag: ${{ steps.meta.outputs.tag }}
        name: ${{ steps.meta.outputs.tag }}
        body: |
          Patch provider(s): ${{ steps.meta.outputs.provider }}
          App version ${{ steps.meta.outputs.version }} · arm64-v8a
          Patch bundle ${{ steps.meta.outputs.patchver }}, built ${{ steps.meta.outputs.suffix }}
          Built with [morphe-desktop](https://github.com/MorpheApp/morphe-desktop).
        allowUpdates: true
        makeLatest: true

    - name: Prune old releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        P="${{ steps.meta.outputs.prefix }}"
        gh release list --limit 100 --json tagName,createdAt \
          | jq -r --arg p "$P-v" '[.[] | select(.tagName|startswith($p))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
          | while read -r t; do
              [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag && echo "pruned $t"
            done
        echo "--- current releases ---"
        gh release list --limit 10
