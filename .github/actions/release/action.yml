name: Releasing APK files
description: Publish the built APK as a GitHub release
inputs:
  target:
    description: Target whose identity report must match the release
    required: true
runs:
  using: "composite"
  steps:
    - name: Read build metadata
      id: meta
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        python3 src/build/release_contract.py "$TARGET" --github-output

    - name: Release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: ${{ steps.meta.outputs.apkpath }}
        tag: ${{ steps.meta.outputs.tag }}
        name: ${{ steps.meta.outputs.tag }}
        body: |
          Patch provider(s): ${{ steps.meta.outputs.provider }}
          App version ${{ steps.meta.outputs.version }} · arm64-v8a
          
          **Applied patches**
          ${{ steps.meta.outputs.aplist }}
          Patch bundle ${{ steps.meta.outputs.patchver }}, built ${{ steps.meta.outputs.suffix }}
          
          `${{ steps.meta.outputs.apkname }}` · ${{ steps.meta.outputs.sizemb }} MB
          SHA-256 `${{ steps.meta.outputs.sha256 }}`
          
          Verify before installing: `sha256sum ${{ steps.meta.outputs.apkname }}`
          Built in public CI with [morphe-desktop](https://github.com/MorpheApp/morphe-desktop).
        allowUpdates: true
        # One repo, many apps. makeLatest moves the "Latest" badge to whichever app built
        # most recently, so the releases page advertises a random app as the current one.
        makeLatest: false

    - name: Preview retention (no deletion)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RETENTION_PREFIX: ${{ steps.meta.outputs.prefix }}
      run: |
        python3 src/etc/release_retention.py --repo "$GITHUB_REPOSITORY" \
          --prefix "$RETENTION_PREFIX" --output retention-preview.json \
          --summary "$GITHUB_STEP_SUMMARY"
