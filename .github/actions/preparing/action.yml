name: Preparing to patch
description: Install tooling and start the Cloudflare bypass containers
inputs:
  install_bouncy_castle:
    description: 'Install Bouncy Castle provider for BKS keystore'
    required: false
    default: 'false'
  install_usque:
    description: 'Install usque for Cloudflare WARP proxy'
    required: false
    default: 'false'
  start_store_services:
    description: 'Start or reuse the local store download services'
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
    - name: Set up jdk
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: 'zulu'
        java-version: '21'
    - name: Setup usque
      if: inputs.install_usque == 'true'
      shell: bash
      run: |
        wget -q -O usque.zip https://github.com/Diniboy1123/usque/releases/download/v4.2.1/usque_4.2.1_linux_amd64.zip
        # Pinned digest of the v4.2.1 release asset (GitHub release metadata, 20 Jul 2026). A mismatch stops the job.
        echo "4117e20695078af9c11edecd1a826c009bbc7ea0b7f64458612b4198910bc313  usque.zip" | sha256sum -c --quiet - || { echo "::error::usque.zip checksum mismatch; not installed"; exit 1; }
        unzip -o usque.zip -d usque
        chmod +x usque/usque
        sudo mv usque/usque /usr/local/bin/usque
        rm -rf usque usque.zip
        usque register --accept-tos
        usque socks -b 127.0.0.1 -p 9099 &
        sleep 5
        # 8 Oct 2026 (W2): a dead proxy used to print one line and pass silently.
        if curl -x socks5://127.0.0.1:9099 -s -o /dev/null -w "%{http_code}" https://www.google.com; then
          echo "[+] usque SOCKS5 proxy is ready"
        else
          echo "::warning::usque proxy did not answer; downloads that need the WARP proxy will fail"
          echo "- usque WARP proxy did not answer; downloads that need it will fail" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Start or reuse store download services
      if: inputs.start_store_services == 'true'
      shell: bash
      run: bash src/build/store_services.sh
    - name: Install Bouncy Castle provider for BKS keystore
      if: inputs.install_bouncy_castle == 'true'
      shell: bash
      run: |
        sudo apt-get install -y -q libbcprov-java
        BCPROV=$(find /usr/share/java -name "bcprov-*.jar" | grep -v debian | head -1)
        sudo cp "$BCPROV" "$JAVA_HOME/lib/bcprov.jar"
        LAST_PROV=$(grep "^security.provider\." "$JAVA_HOME/conf/security/java.security" \
          | grep -oP '(?<=security\.provider\.)\d+' | sort -n | tail -1)
        echo "security.provider.$((LAST_PROV+1))=org.bouncycastle.jce.provider.BouncyCastleProvider" \
          | sudo tee -a "$JAVA_HOME/conf/security/java.security"
        echo "[+] Bouncy Castle registered as provider #$((LAST_PROV+1))"
